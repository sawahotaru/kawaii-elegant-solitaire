name: CI

# main が更新されたらビルドが通ることを確かめ、**通ったときだけ**公開先へ反映を依頼する。
# 壊れた版が公開に出ないための門番。
#
# デプロイ通知には Secret `OL_DISPATCH_PAT` が要る（設定手順は運用側で管理）。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: vitest + tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ソルバーの回帰テスト。ビルドが通ることと、可解判定・オートコンプリートが
      # 正しいことは別物で、後者が壊れても型エラーにはならない
      # （「解けると称して詰み盤面を配る」「非合法な手順で勝ちにする」は緑のままビルドが通る）。
      - run: npm test

      # npm run build = tsc && vite build。型エラーでもビルドエラーでも落ちる。
      # 壊れた状態で公開先を起こさないための門番。
      - run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html was not produced"; exit 1; }
          ls -la dist

  notify:
    name: Notify deploy
    needs: build
    # ビルドが通った main への push のときだけデプロイする（PR では走らせない）
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Notify deploy
        env:
          TOKEN: ${{ secrets.OL_DISPATCH_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret OL_DISPATCH_PAT is not set (repo Settings → Secrets → Actions)."
            exit 1
          fi
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sawahotaru/oracle-lab/dispatches \
            -d '{"event_type":"solitaire-updated","client_payload":{"service":"solitaire","ref":"${{ github.sha }}"}}'
          echo "Dispatched."
