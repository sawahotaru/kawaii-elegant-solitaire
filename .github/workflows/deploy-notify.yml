name: Deploy to lab.4510.be

# このリポジトリの main が更新されたら、まずビルドが通ることを確かめ、**通ったときだけ**
# 統合ハブ oracle-lab のデプロイを起動する。
# oracle-lab 側 (deploy-oracle.yml) が repository_dispatch: solitaire-updated を受け、
# solitaire を **CI側で Vite ビルド → dist/ をVMへ rsync**（Caddyが静的配信）する。
# solitaire は compose サービスではないため、VMでのコンテナビルドは発生しない（超低負荷）。
#
# ※ 既存の GitHub Pages 向け deploy.yml とは別物（併存）。Pages と lab.4510.be/solitaire/ の両方へ出る。
#
# 必要な設定（1回だけ）: Settings → Secrets and variables → Actions に Secret `OL_DISPATCH_PAT`。
#   値は sawahotaru/oracle-lab へ書き込める PAT（fine-grained: Contents Read and write／classic: repo）。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: vitest + tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ソルバーの回帰テスト。ビルドが通ることと、可解判定・オートコンプリートが
      # 正しいことは別物で、後者が壊れても型エラーにはならない
      # （「解けると称して詰み盤面を配る」「非合法な手順で勝ちにする」は緑のままビルドが通る）。
      - run: npm test

      # npm run build = tsc && vite build。型エラーでもビルドエラーでも落ちる。
      # 壊れた状態で oracle-lab を起こさないための門番。
      - run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html was not produced"; exit 1; }
          ls -la dist

  notify:
    name: Trigger oracle-lab deploy
    needs: build
    # ビルドが通った main への push のときだけデプロイする（PR では走らせない）
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger oracle-lab deploy (scoped to solitaire)
        env:
          TOKEN: ${{ secrets.OL_DISPATCH_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret OL_DISPATCH_PAT is not set (repo Settings → Secrets → Actions)."
            exit 1
          fi
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sawahotaru/oracle-lab/dispatches \
            -d '{"event_type":"solitaire-updated","client_payload":{"service":"solitaire","ref":"${{ github.sha }}"}}'
          echo "Dispatched solitaire-updated → oracle-lab (CI builds Vite, rsync dist)."
